name: Code Scanning Demo (sqlsift)

on:
  workflow_dispatch:

jobs:
  sqlsift-code-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Generate SARIF with sqlsift
        shell: bash
        run: |
          set +e
          cargo run -p sqlsift-cli -- check \
            --schema tests/fixtures/schema.sql \
            -f sarif \
            tests/fixtures/invalid_query.sql > results.sarif
          status=$?
          echo "sqlsift_exit_code=$status"
          if [ ! -s results.sarif ]; then
            echo "SARIF output was empty" >&2
            exit 1
          fi
          exit 0

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: results.sarif
